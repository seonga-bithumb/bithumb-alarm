name: Bithumb Daily MA Alert

on:
  workflow_dispatch:
  schedule:
    - cron: '2-59/5 * * * *'

concurrency:
  group: bithumb-daily-ma-alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/cache@v4
        with:
          path: alarm_state.json
          key: alarm-state-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            alarm-state-v1-

      - run: pip install requests

      - name: Check daily signal
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py
